<title>OA 图标审核稿</title>
<style>
:root {
  --bg: #eef1f5;
  --panel: #ffffff;
  --ink: #152033;
  --muted: #66758a;
  --line: #d7dee8;
  --blue: #1f5fbd;
  --green: #17865b;
  --orange: #b76218;
  --red: #b42318;
  --slate: #42526a;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background:
    radial-gradient(circle at 12% 0%, rgba(31,95,189,.12), transparent 28rem),
    linear-gradient(135deg, #f7f8fb, var(--bg));
  color: var(--ink);
  font-family: "Microsoft YaHei", "Segoe UI", sans-serif;
}
.wrap { max-width: 1280px; margin: 0 auto; padding: 28px; }
.hero {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 20px;
  padding: 22px 24px;
  background: rgba(255,255,255,.86);
  border: 1px solid rgba(215,222,232,.9);
  border-radius: 18px;
  box-shadow: 0 18px 45px rgba(21,32,51,.08);
}
h1 { margin: 0 0 8px; font-size: 26px; letter-spacing: .02em; }
.sub { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; }
.badge {
  padding: 8px 12px;
  border-radius: 999px;
  background: #e8f0ff;
  color: var(--blue);
  font-size: 13px;
  font-weight: 700;
  white-space: nowrap;
}
.section { margin-top: 26px; }
.section h2 { margin: 0 0 14px; font-size: 16px; color: #2b3a4e; }
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 14px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 16px;
  padding: 16px;
  min-height: 148px;
  box-shadow: 0 10px 25px rgba(21,32,51,.06);
}
.icon-box {
  width: 64px;
  height: 64px;
  display: grid;
  place-items: center;
  border-radius: 18px;
  margin-bottom: 12px;
  background: #edf3ff;
  color: var(--blue);
}
.card.green .icon-box { background: #eaf7f1; color: var(--green); }
.card.orange .icon-box { background: #fff3e6; color: var(--orange); }
.card.red .icon-box { background: #fff0ef; color: var(--red); }
.card.slate .icon-box { background: #eef2f7; color: var(--slate); }
.name { font-size: 14px; font-weight: 700; margin-bottom: 5px; }
.id { font-size: 12px; color: var(--muted); font-family: Consolas, monospace; }
svg.icon { width: 42px; height: 42px; stroke: currentColor; fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
svg.icon .fill { fill: currentColor; stroke: none; opacity: .14; }
svg.icon .solid { fill: currentColor; stroke: none; }
.usage {
  margin-top: 22px;
  padding: 18px 20px;
  background: #152033;
  color: #dbe4f0;
  border-radius: 16px;
  font-size: 13px;
  line-height: 1.8;
}
.usage code { color: #c7ddff; }
</style>
</head>

    <div class="grid" data-icons="production:生产劳动:orange,education:教育改造:blue,politics:政工党建:red,supervision:监管安全:blue,prison-admin:狱政管理:slate,security:安防设施:slate,patrol:巡查督导:blue,medical:医疗卫生:green,psychology:心理矫治:green,logistics:后勤保障:orange,equipment:装备管理:slate,meeting:会议活动:blue,notice:通知公告:orange,training:培训学习:blue,assessment:考核评估:green,discipline:纪律规范:red,visitor:会见管理:green,finance:财务物资:orange,kitchen:生活伙食:orange,maintenance:维修维护:slate" data-prefix="cat"></div>
  </div>

  <div class="section">
    <h2>通用备选标志</h2>
    <div class="grid" data-icons="star:重点事项:orange,flag:标记事项:red,target:目标任务:blue,bookmark:收藏归类:slate,tag:标签分类:green,map:区域位置:blue,light:创新建议:orange,link:关联事项:blue,eye:查看监督:slate,compass:方向指引:blue,layers:层级模块:slate,grid:综合分类:blue,certificate:荣誉资质:orange,handshake:协作共建:green,database:数据资料:slate,briefcase:综合办公:blue,roadmap:计划路线:green,shield-star:重点安保:red" data-prefix="gen"></div>
  </div>

  <div class="usage">
    审核建议：如果这个方向可以，我会把图标整理成一个统一的 SVG sprite 或 Jinja 宏，例如 <code>&lt;svg class="icon"&gt;&lt;use href="#ico-task"&gt;&lt;/use&gt;&lt;/svg&gt;</code>，然后分批替换所有模板中的 emoji。当前页面只是审核稿，不会影响现有系统界面。
  </div>
</div>
<script>
(function () {
  var colorMap = { blue: 'blue', green: 'green', orange: 'orange', red: 'red', slate: 'slate' };
  var grids = document.querySelectorAll('[data-icons]');
  for (var g = 0; g < grids.length; g++) {
    var items = grids[g].getAttribute('data-icons').split(',');
    var prefix = grids[g].getAttribute('data-prefix') || 'ico';
    for (var i = 0; i < items.length; i++) {
      var parts = items[i].split(':');
      var id = parts[0], name = parts[1], tone = colorMap[parts[2]] || 'blue';
      var symbolId = prefix + '-' + id;
      var card = document.createElement('div');
      card.className = 'card ' + tone;
      card.innerHTML = '<div class="icon-box"><svg class="icon"><use href="#' + symbolId + '"></use></svg></div><div class="name">' + name + '</div><div class="id">' + symbolId + '</div>';
      grids[g].appendChild(card);
    }
  }
})();
</script>
</body>
