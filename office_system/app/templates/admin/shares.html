<!DOCTYPE html>
<html>
{% from '_icon.html' import icon %}
<head>
<meta charset="utf-8"><title>共享文件夹</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<style>
body { background: #f1f5f9; }
.breadcrumb { display: flex; align-items: center; gap: 8px; font-size: 13px; color: #64748b; margin-bottom: 16px; }
.breadcrumb a { color: #64748b; text-decoration: none; }
.breadcrumb a:hover { color: #2563eb; }
.breadcrumb-sep { color: #cbd5e1; }
.back-btn { display: inline-flex; align-items: center; gap: 6px; padding: 6px 12px; font-size: 13px; color: #64748b; background: white; border: 1px solid #e2e8f0; border-radius: 6px; text-decoration: none; transition: all 0.2s; }
.back-btn:hover { border-color: #2563eb; color: #2563eb; }
</style>
</head>
<body style="padding:24px;background:#f1f5f9;">

<!-- Breadcrumb -->
<div class="breadcrumb">
  <a href="{{ url_for('index_bp.workbench') }}">工作台</a>
  <span class="breadcrumb-sep">›</span>
  <span>共享文件夹</span>
</div>

<!-- Back Button -->
<div style="margin-bottom:16px;">
  <a href="{{ url_for('index_bp.workbench') }}" class="back-btn">← 返回工作台</a>
</div>

<div class="page-header">
  <div>
    <h2 class="page-title">共享文件夹</h2>
    <p class="page-subtitle">配置内网共享文件夹快捷方式</p>
  </div>
  <div class="page-actions">
    <button type="button" class="btn btn-primary" id="addBtn">{{ icon('add') }} 添加</button>
  </div>
</div>

<!-- Batch Actions Bar -->
<div id="batchBar" style="display:none;background:#1e293b;color:white;padding:12px 16px;border-radius:10px;margin-bottom:16px;align-items:center;justify-content:space-between;">
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="batchCount">已选择 0 项</span>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
      <input type="checkbox" id="selectAll" onchange="toggleSelectAll()" style="width:16px;height:16px;"> 全选
    </label>
  </div>
  <div style="display:flex;gap:8px;">
    <button type="button" style="background:#dc2626;border:1px solid #dc2626;color:white;padding:6px 12px;font-size:12px;border-radius:6px;cursor:pointer;" onclick="batchDelete()">{{ icon('trash') }} 批量删除</button>
    <button type="button" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;padding:6px 12px;font-size:12px;border-radius:6px;cursor:pointer;" onclick="clearSelection()">✕ 取消</button>
  </div>
</div>

<div class="card card-nopad">
  <table class="table">
    <thead>
      <tr>
        <th style="width:40px;"><input type="checkbox" id="selectAllTop" onchange="toggleSelectAll()" style="width:16px;height:16px;cursor:pointer;"></th>
        <th style="width:50px;">ID</th>
        <th style="width:150px;">名称</th>
        <th>路径</th>
        <th style="width:60px;">排序</th>
        <th style="width:80px;">状态</th>
        <th style="width:120px;">操作</th>
      </tr>
    </thead>
    <tbody>
      {% for f in folders %}
      <tr data-id="{{ f.id }}">
        <td><input type="checkbox" class="share-cb" value="{{ f.id }}" onchange="updateBatchBar()" style="width:16px;height:16px;cursor:pointer;"></td>
        <td style="color:#94a3b8;">#{{ f.id }}</td>
        <td style="font-weight:500;">{{ f.name }}</td>
        <td style="color:#64748b;font-size:12px;">{{ f.folder_path }}</td>
        <td>{{ f.sort_order }}</td>
        <td>{% if f.is_active %}<span class="badge badge-success">启用</span>{% else %}<span class="badge badge-gray">禁用</span>{% endif %}</td>
        <td>
          <button class="btn btn-sm edit-btn" data-id="{{ f.id }}" data-name="{{ f.name }}" data-path="{{ f.folder_path }}" data-order="{{ f.sort_order }}" data-active="{{ f.is_active }}" data-roles="{{ f.visible_roles }}">{{ icon('edit') }}</button>
          <form method="post" action="/admin/shares/{{ f.id }}/delete" style="display:inline;" onsubmit="return confirm('确认删除？');">
            <button type="submit" class="btn btn-sm btn-danger">{{ icon('trash') }}</button>
          </form>
        </td>
      </tr>
      {% endfor %}
    </tbody>
  </table>
</div>

<div id="editModal" style="display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.5);z-index:9999;align-items:center;justify-content:center;">
  <div style="background:white;border-radius:12px;padding:32px;width:500px;max-width:90%;">
    <h3 id="modalTitle" style="font-size:18px;font-weight:600;margin-bottom:24px;">添加文件夹</h3>
    <form id="editForm" method="post">
      <div class="form-group">
        <label class="form-label">名称 <span style="color:#dc2626;">*</span></label>
        <input type="text" name="name" id="eName" class="form-input" required style="height:44px;">
      </div>
      <div class="form-group">
        <label class="form-label">路径 <span style="color:#dc2626;">*</span></label>
        <input type="text" name="folder_path" id="ePath" class="form-input" placeholder="如：\\\\server\\share" required style="height:44px;">
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:16px;">
        <div class="form-group">
          <label class="form-label">排序</label>
          <input type="number" name="sort_order" id="eOrder" class="form-input" value="0" style="height:44px;">
        </div>
        <div class="form-group">
          <label class="form-label">可见角色</label>
          <select name="visible_roles" id="eRoles" class="form-select" style="height:44px;">
            <option value="all">所有人</option>
            <option value='["super_admin","dept_admin"]'>管理员</option>
          </select>
        </div>
      </div>
      <label style="display:flex;align-items:center;gap:6px;margin:16px 0;"><input type="checkbox" name="is_active" id="eActive" value="1" checked> 启用</label>
      <div style="display:flex;gap:12px;margin-top:24px;">
        <button type="submit" class="btn btn-primary btn-lg" style="flex:1;">保存</button>
        <button type="button" id="cancelEdit" class="btn btn-lg">取消</button>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
    var modal = document.getElementById('editModal');
    var form = document.getElementById('editForm');
    document.getElementById('addBtn').addEventListener('click', function(){
        document.getElementById('modalTitle').textContent = '添加文件夹';
        form.reset();
        document.getElementById('eActive').checked = true;
        form.action = '{{ url_for("admin.share_add") }}';
        modal.style.display = 'flex';
    });
    document.querySelectorAll('.edit-btn').forEach(function(btn){
        btn.addEventListener('click', function(){
            document.getElementById('modalTitle').textContent = '编辑文件夹';
            document.getElementById('eName').value = this.dataset.name;
            document.getElementById('ePath').value = this.dataset.path;
            document.getElementById('eOrder').value = this.dataset.order;
            document.getElementById('eRoles').value = this.dataset.roles;
            document.getElementById('eActive').checked = this.dataset.active === '1';
            form.action = '/admin/shares/' + this.dataset.id + '/edit';
            modal.style.display = 'flex';
        });
    });
    document.getElementById('cancelEdit').addEventListener('click', function(){ modal.style.display = 'none'; });
    modal.addEventListener('click', function(e){ if(e.target === modal) modal.style.display = 'none'; });
})();

// Batch operations
function getSelectedIds() {
    var cbs = document.querySelectorAll('.share-cb:checked');
    var ids = [];
    for (var i = 0; i < cbs.length; i++) ids.push(parseInt(cbs[i].value));
    return ids;
}
function updateBatchBar() {
    var ids = getSelectedIds();
    var bar = document.getElementById('batchBar');
    var ct = document.getElementById('batchCount');
    if (ids.length > 0) { bar.style.display = 'flex'; ct.textContent = '已选择 ' + ids.length + ' 项'; }
    else { bar.style.display = 'none'; }
}
function toggleSelectAll() {
    var checked = document.getElementById('selectAll').checked || document.getElementById('selectAllTop').checked;
    var cbs = document.querySelectorAll('.share-cb');
    for (var i = 0; i < cbs.length; i++) cbs[i].checked = checked;
    updateBatchBar();
}
function clearSelection() {
    var cbs = document.querySelectorAll('.share-cb');
    for (var i = 0; i < cbs.length; i++) cbs[i].checked = false;
    updateBatchBar();
}
function batchDelete() {
    var ids = getSelectedIds();
    if (ids.length === 0) { alert('请先选择共享文件夹'); return; }
    if (!confirm('确定要删除选中的 ' + ids.length + ' 个共享文件夹吗？（不可恢复）')) return;
    var xhr = new XMLHttpRequest();
    xhr.open('POST', '{{ url_for("admin.batch_delete_shares") }}', true);
    xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.onload = function() {
        if (xhr.status === 200) {
            try { var d = JSON.parse(xhr.responseText); if(d.success) location.reload(); else alert(d.message||'操作失败'); }
            catch(e) { location.reload(); }
        } else { alert('操作失败'); }
    };
    xhr.onerror = function(){ alert('操作失败'); };
    xhr.send('ids=' + encodeURIComponent(JSON.stringify(ids)));
}
</script>
</body>
</html>
