<!DOCTYPE html>
<html lang="zh-CN">
{% from '_icon.html' import icon %}
<head>
<meta charset="utf-8"><title>编辑文件信息</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<style>
body{margin:0;padding:0;background:#f1f5f9;color:#0f172a}
.file-edit{width:100%;background:#fff;border:1px solid #d9e5f4;box-sizing:border-box}
.file-edit-head{display:table;width:100%;padding:12px 16px;border-bottom:1px solid #d9e5f4;box-sizing:border-box}
.file-edit-title,.file-edit-back{display:table-cell;vertical-align:middle}
.file-edit-title h2{display:inline;margin:0;font-size:18px}
.file-edit-title span{margin-left:10px;color:#64748b;font-size:13px}
.file-edit-back{width:100px;text-align:right}
.file-edit-body{padding:14px 16px}
.file-edit-row{display:table;width:100%;table-layout:fixed}
.file-edit-field{display:table-cell;padding-right:8px;vertical-align:top}
.file-edit-field:last-child{padding-right:0}
.file-edit-field-name{width:46%}
.file-edit-field label{display:block;margin-bottom:5px;font-size:13px;font-weight:700}
.file-edit-field .form-input,.file-edit-field .form-select{width:100%;height:38px;box-sizing:border-box}
.file-edit-help{margin-top:8px;color:#64748b;font-size:12px}
.file-edit-actions{margin-top:14px;padding-top:12px;border-top:1px solid #e5edf7;text-align:right}
.file-edit-actions .btn{margin-left:4px}
@media(max-width:760px){.file-edit-field{display:block;width:auto;padding:0 0 10px}}
</style>
</head>
<body>
<div class="file-edit">
  <div class="file-edit-head">
    <div class="file-edit-title"><h2>{{ icon('edit') }} 编辑文件信息</h2><span>只修改显示信息，不会替换原文件</span></div>
    <div class="file-edit-back"><a class="btn" href="{{ url_for('files.list_files') }}">返回列表</a></div>
  </div>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% for category, message in messages %}<div class="alert alert-{{ category }}">{{ message }}</div>{% endfor %}
  {% endwith %}
  <form method="post" class="file-edit-body">
    <div class="file-edit-row">
      <div class="file-edit-field file-edit-field-name">
        <label>文件显示名称</label>
        <input class="form-input" name="original_name" value="{{ file.original_name }}" maxlength="500" required>
      </div>
      <div class="file-edit-field">
        <label>分类</label>
        <select class="form-select" name="category_id">
          <option value="">不选择分类</option>
          {% for item in categories %}<option value="{{ item.id }}" {% if file.category_id == item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}
        </select>
      </div>
      <div class="file-edit-field">
        <label>关联栏目</label>
        <select class="form-select" name="column_id">
          <option value="">不选择栏目</option>
          {% for item in columns %}<option value="{{ item.id }}" {% if selected_column_id == item.id %}selected{% endif %}>{{ item.name }}</option>{% endfor %}
        </select>
      </div>
    </div>
    <div class="file-edit-help">保存后会更新文件列表中的名称、分类和关联栏目；此前遗留的任务关联会被清除。</div>
    <div class="file-edit-actions">
      <a class="btn" href="{{ url_for('files.list_files') }}">取消</a>
      <button class="btn btn-primary" type="submit">{{ icon('save') }} 保存修改</button>
    </div>
  </form>
</div>
</body>
</html>
