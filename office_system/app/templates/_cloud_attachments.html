{% if cloud_attachments %}
<div style="margin-top:10px;padding-top:10px;border-top:1px solid #e2e8f0;">
  <div style="font-size:12px;font-weight:700;color:#64748b;margin-bottom:6px;">云盘 同步</div>
  {% for cloud in cloud_attachments %}
  <span style="display:inline-block;margin:3px;padding:6px 10px;border:1px solid {% if cloud.sync_status == 'synced' %}#a7f3d0{% elif cloud.sync_status == 'failed' %}#fecaca{% else %}#fde68a{% endif %};border-radius:6px;background:#fff;font-size:12px;">
    {% if cloud.sync_status == 'synced' %}<a href="{{ cloud.cloud_url }}" target="_blank" style="color:#047857;text-decoration:none;">云端打开：{{ cloud.original_name }}</a>
    {% elif cloud.sync_status == 'failed' %}<span style="color:#dc2626;" title="{{ cloud.sync_error }}">同步失败：{{ cloud.original_name }}</span>
    {% else %}<span style="color:#a16207;">待同步：{{ cloud.original_name }}</span>{% endif %}
  </span>
  {% endfor %}
</div>
{% endif %}
