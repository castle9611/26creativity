<!DOCTYPE html>
<html>
{% from '_icon.html' import icon %}
<head>
<meta charset="utf-8"><title>{{ sheet.name }} - 在线表格（只读）</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<link rel="stylesheet" href="{{ url_for('static', filename='x-spreadsheet/dist/xspreadsheet.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<style>
body { margin:0; padding:0; background:#f8f9fa; font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; }
.header-bar {
  display:flex; align-items:center; gap:8px;
  padding:4px 12px; background:white; border-bottom:1px solid #e2e8f0;
  min-height:44px; position:fixed; top:0; left:0; right:0; z-index:100;
}
.header-bar .title { font-size:14px; font-weight:600; color:#0f172a; display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:1; }
.header-bar .title .svg-icon { width:16px; height:16px; flex-shrink:0; }
.header-bar .actions { display:flex; gap:4px; align-items:center; flex-shrink:0; margin-left:auto; }
.header-bar .btn { padding:3px 6px; font-size:12px; border:1px solid #e2e8f0; border-radius:4px; background:white; cursor:pointer; text-decoration:none; color:#475569; white-space:nowrap; line-height:1.3; }
.header-bar .btn:hover { border-color:#2563eb; color:#2563eb; }
.header-bar .btn-primary { background:#2563eb; border-color:#2563eb; color:white; }
.header-bar .btn-primary:hover { background:#1d4ed8; }
#xspreadsheet-readonly { position:fixed; top:44px; left:0; right:0; bottom:0; }
</style>
</head>
<body>

<div class="header-bar">
  <div class="title">{{ icon('memo') }} {{ sheet.name }} <span class="badge badge-info" style="font-size:11px;">只读模式</span></div>
  <div class="actions">
    {% if can_edit %}
    <a href="{{ url_for('sheets.edit_sheet', sheet_id=sheet.id) }}" class="btn btn-primary">{{ icon('edit') }} 编辑</a>
    {% endif %}
    <a href="{{ url_for('sheets.export_xls', sheet_id=sheet.id) }}" class="btn">{{ icon('export') }} 导出XLS</a>
    <a href="{{ url_for('index_bp.workbench') }}" class="btn nav-text-link">返回首页</a>
  </div>
</div>

<div id="xspreadsheet-readonly"></div>

<script src="{{ url_for('static', filename='x-spreadsheet/dist/xspreadsheet.js') }}"></script>
<script src="{{ url_for('static', filename='x-spreadsheet/dist/locale/zh-cn.js') }}"></script>
<script src="{{ url_for('static', filename='js/sheet_zh_cn_patch.js') }}"></script>
<script>
(function() {
  var sheetId = {{ sheet.id }};
  var xs = x_spreadsheet('#xspreadsheet-readonly', {
    language: 'zh-cn',
    showToolbar: false,
    showGrid: true,
    view: {
      height: function() { return window.innerHeight - 52; },
      width: function() { return window.innerWidth; }
    }
  });

  function normalizeSheetData(data) {
    if (!data) return null;
    if (Array.isArray(data)) return data.length ? data : null;
    if (typeof data === 'object') {
      if (data.name || data.rows || data.cols || data.styles || data.merges || data.celldata) {
        return [data];
      }
    }
    return null;
  }

  // Load data
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/sheets/' + sheetId + '/load', true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var data = JSON.parse(xhr.responseText);
        var loadedData = normalizeSheetData(data);
        if (loadedData) xs.loadData(loadedData);
      } catch(e) { console.warn('Failed to load sheet data:', e); }
    }
  };
  xhr.send();
})();
</script>
</body>
</html>
