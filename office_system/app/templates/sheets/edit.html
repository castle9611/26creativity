<!DOCTYPE html>
<html>
{% from '_icon.html' import icon %}
<head>
<meta charset="utf-8"><title>{{ sheet.name }} - 在线表格</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="{{ url_for('static', filename='x-spreadsheet/dist/xspreadsheet.css') }}">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif; background:#f8f9fa; }
.header-bar {
  display:flex; align-items:center; gap:8px;
  padding:4px 12px; background:white; border-bottom:1px solid #e2e8f0;
  min-height:44px; position:fixed; top:0; left:0; right:0; z-index:100;
}
.header-bar .title { font-size:14px; font-weight:600; color:#0f172a; display:flex; align-items:center; gap:6px; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; flex-shrink:1; }
.header-bar .title .svg-icon { width:16px; height:16px; flex-shrink:0; }
.header-bar .actions { display:flex; gap:4px; align-items:center; flex-shrink:0; margin-left:auto; }
.header-bar .btn { padding:3px 6px; font-size:12px; border:1px solid #e2e8f0; border-radius:4px; background:white; cursor:pointer; text-decoration:none; color:#475569; transition:all .15s; white-space:nowrap; line-height:1.3; }
.header-bar .btn:hover { border-color:#2563eb; color:#2563eb; }
.header-bar .btn-primary { background:#2563eb; border-color:#2563eb; color:white; }
.header-bar .btn-primary:hover { background:#1d4ed8; }
#xsheet { position:fixed; top:44px; left:0; right:0; bottom:0; }
</style>
</head>
<body>

<div class="header-bar">
  <div class="title">{{ icon('memo') }} {{ sheet.name }}</div>
  <div class="actions">
    <button class="btn btn-primary" onclick="publishSheet()">📤 发布</button>
    <a href="{{ url_for('sheets.export_xls', sheet_id=sheet.id) }}" class="btn">📥 XLS</a>
    <a href="{{ url_for('sheets.view_sheet', sheet_id=sheet.id) }}" class="btn">预览</a>
    <a href="{{ url_for('sheets.list_sheets') }}" class="btn">关闭</a>
  </div>
</div>

<div id="xsheet"></div>

<script src="{{ url_for('static', filename='x-spreadsheet/dist/xspreadsheet.js') }}"></script>
<script src="{{ url_for('static', filename='x-spreadsheet/dist/locale/zh-cn.js') }}"></script>
<script src="{{ url_for('static', filename='js/sheet_zh_cn_patch.js') }}"></script>
<script>
(function() {
  var sid = {{ sheet.id }};
  var el = document.getElementById('xsheet');
  el.style.height = (window.innerHeight - 52) + 'px';

  var xs = x_spreadsheet('#xsheet', {
    language: 'zh-cn',
    showToolbar: true,
    showGrid: true,
    view: { height: function() { return window.innerHeight - 52; }, width: function() { return window.innerWidth; } }
  });

  function normalizeSheetData(data) {
    if (!data) return null;
    if (Array.isArray(data)) return data.length ? data : null;
    if (typeof data === 'object') {
      if (data.name || data.rows || data.cols || data.styles || data.merges || data.celldata) {
        return [data];
      }
    }
    return null;
  }

  // Load data (with cache busting)
  var xhr = new XMLHttpRequest();
  xhr.open('GET', '/sheets/' + sid + '/load?_=' + Date.now(), true);
  xhr.onload = function() {
    if (xhr.status === 200) {
      try {
        var d = JSON.parse(xhr.responseText);
        var loadedData = normalizeSheetData(d);
        if (loadedData) { xs.loadData(loadedData); }
      } catch(e) { console.warn('Failed to load sheet data:', e); }
    }
  };
  xhr.send();

  // Auto-save state
  var dirty = false;
  var saving = false;
  var saveStatus = document.createElement('span');
  saveStatus.style.cssText = 'font-size:11px;color:#94a3b8;margin-right:8px;';
  document.querySelector('.header-bar .actions').insertBefore(saveStatus, document.querySelector('.header-bar .actions').firstChild);
  var sheetActive = false;
  document.addEventListener('mousedown', function(e) {
    sheetActive = !!(e.target && (e.target === el || (el.contains && el.contains(e.target))));
  }, true);

  // Track changes via x-spreadsheet change event (skip initial load)
  var loaded = false;
  setTimeout(function() {
    if (typeof xs.change === 'function') {
      xs.change(function() { if (loaded) dirty = true; });
    }
    loaded = true;
  }, 500);

  // Manual save
  window.saveSheet = function(cb) {
    if (saving) { if (cb) cb(); return; }
    var d = xs.getData();
    saving = true;
    saveStatus.textContent = '⏳ 保存中...';
    saveStatus.style.color = '#94a3b8';
    var xhr2 = new XMLHttpRequest();
    xhr2.open('POST', '{{ url_for("sheets.save_sheet_data", sheet_id=sheet.id) }}', true);
    xhr2.setRequestHeader('Content-Type', 'application/json;charset=UTF-8');
    xhr2.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr2.onload = function() {
      saving = false;
      if (xhr2.status === 200) {
        dirty = false;
        saveStatus.textContent = '✓ 已保存';
        saveStatus.style.color = '#059669';
        setTimeout(function() { saveStatus.textContent = ''; }, 2000);
      } else {
        saveStatus.textContent = '✗ 保存失败';
        saveStatus.style.color = '#dc2626';
      }
      if (cb) cb();
    };
    xhr2.onerror = function() { saving = false; saveStatus.textContent = '✗ 网络错误'; saveStatus.style.color = '#dc2626'; if (cb) cb(); };
    xhr2.send(JSON.stringify(d));
  };

  // Auto-save every 2 seconds
  setInterval(function() {
    if (dirty && !saving) { saveSheet(); }
  }, 2000);

  // Publish function
  window.publishSheet = function() {
    if (!confirm('确认发布此表格？发布后所有人(按权限设置)可查看。')) return;
    // First auto-save current data
    window.saveSheet(function() {
      var xhr = new XMLHttpRequest();
      xhr.open('POST', '{{ url_for("sheets.publish_sheet", sheet_id=sheet.id) }}', true);
      xhr.setRequestHeader('Content-Type', 'application/x-www-form-urlencoded');
      xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
      xhr.onload = function() {
        if (xhr.status === 200) {
          alert('已发布！');
          saveStatus.textContent = '✓ 已发布';
          saveStatus.style.color = '#059669';
        } else { alert('发布失败'); }
      };
      xhr.onerror = function() { alert('网络错误'); };
      xhr.send('');
    });
  };

  // Ctrl+S
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault(); saveSheet();
    }
  });

  function parseTsv(text) {
    text = (text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n');
    text = text.replace(/\n$/, '');
    if (text.indexOf('\t') < 0 && text.indexOf('\n') < 0) return null;
    var lines = text.split('\n');
    var rows = [];
    for (var r = 0; r < lines.length; r++) {
      rows.push(lines[r].split('\t'));
    }
    return rows;
  }

  function selectedCell() {
    try {
      var selector = xs.sheet && xs.sheet.data && xs.sheet.data.selector;
      return {
        ri: selector && typeof selector.ri === 'number' ? selector.ri : 0,
        ci: selector && typeof selector.ci === 'number' ? selector.ci : 0
      };
    } catch (e) {
      return { ri: 0, ci: 0 };
    }
  }

  function pasteTsvToSheet(rows) {
    var pos = selectedCell();
    for (var r = 0; r < rows.length; r++) {
      for (var c = 0; c < rows[r].length; c++) {
        xs.cellText(pos.ri + r, pos.ci + c, rows[r][c]);
      }
    }
    if (typeof xs.reRender === 'function') xs.reRender();
    dirty = true;
    saveStatus.textContent = '已粘贴 ' + rows.length + ' 行';
    saveStatus.style.color = '#2563eb';
    setTimeout(function() { if (dirty) saveStatus.textContent = '有未保存修改'; }, 1200);
  }

  // WPS/Excel copies table cells as tab-separated text. x-spreadsheet's native
  // paste can miss this on older browsers, so we handle that format explicitly.
  document.addEventListener('paste', function(e) {
    var active = document.activeElement;
    var insideSheet = active && (active === el || (el.contains && el.contains(active)));
    if (!insideSheet && !sheetActive) return;
    var clipboard = e.clipboardData || window.clipboardData;
    if (!clipboard || !clipboard.getData) return;
    var text = clipboard.getData('text/plain') || clipboard.getData('Text') || '';
    var rows = parseTsv(text);
    if (!rows) return;
    e.preventDefault();
    pasteTsvToSheet(rows);
  }, true);

  // Resize
  window.addEventListener('resize', function() {
    el.style.height = (window.innerHeight - 52) + 'px';
  });
})();
</script>
</body>
</html>
