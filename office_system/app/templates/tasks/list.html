<!DOCTYPE html>
<html>
{% from '_icon.html' import icon %}
<head>
<meta charset="utf-8"><title>任务列表</title>
<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
<style>
body { background: var(--bg-page); }
.task-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 64px;
  margin-bottom: 14px;
  padding: 14px 18px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background:
    linear-gradient(90deg, rgba(255,255,255,.84), rgba(255,255,255,.94)),
    linear-gradient(135deg, rgba(26, 86, 219, .09), transparent 58%),
    var(--bg-card);
  box-shadow: 0 8px 24px rgba(15, 23, 42, .05);
}
.task-topbar-main {
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
}
.task-crumb {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-muted);
}
.task-crumb a {
  color: var(--text-secondary);
  text-decoration: none;
}
.task-crumb a:hover { color: var(--primary); }
.task-crumb-sep { color: var(--text-muted); }
.task-title-row {
  display: flex;
  align-items: center;
  gap: 10px;
}
.task-title-icon {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  background: linear-gradient(135deg, var(--primary-light), var(--primary-dark));
  box-shadow: 0 6px 14px rgba(26, 86, 219, .18);
}
.task-title-text {
  min-width: 0;
}
.task-title-text h2 {
  margin: 0;
  color: var(--text-primary);
  font-size: 18px;
  line-height: 1.2;
}
.task-title-text p {
  margin: 2px 0 0;
  color: var(--text-secondary);
  font-size: 12px;
}
.task-topbar-actions {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 10px;
  flex: 0 0 auto;
}
@media (max-width: 760px) {
  body { padding: 14px !important; }
  .task-topbar {
    align-items: stretch;
    flex-direction: column;
  }
  .task-topbar-actions {
    justify-content: space-between;
  }
}
.read-badge { margin-left: 8px; padding: 2px 7px; border-radius: 999px; font-size: 11px; font-weight: 600; background: #e0f2fe; color: #0369a1; }
.read-badge.unread { background: #fee2e2; color: #b91c1c; }

/* Stats bar filter buttons */
.stats-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 16px;
    background: #fff;
    border: 1px solid #e2e8f0;
    border-radius: 10px;
    text-decoration: none;
    color: inherit;
    transition: all 0.2s;
    min-width: 100px;
}
.stats-btn:hover { border-color: #2563eb; }
.stats-btn.active {
    background: #2563eb !important;
    border-color: #2563eb !important;
    box-shadow: 0 4px 14px rgba(37,99,235,0.25) !important;
}
.stats-btn.active .stats-num,
.stats-btn.active .stats-icon {
    color: #fff !important;
}
.stats-btn.active .stats-label {
    color: rgba(255,255,255,0.85) !important;
}
/* Overdue/rejected/archived compact buttons */
.stats-btn-sm {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 6px 10px;
    border-radius: 6px;
    text-decoration: none;
    transition: all 0.2s;
    font-size: 12px;
}
.stats-btn-sm.active {
    background: #2563eb !important;
    border-color: #2563eb !important;
    color: #fff !important;
    box-shadow: 0 4px 14px rgba(37,99,235,0.25) !important;
}
</style>
</head>
<body style="padding:24px;background:#f1f5f9;">

<div class="task-topbar">
  <div class="task-topbar-main">
    <div class="task-crumb">
      <a href="{{ url_for('index_bp.workbench') }}">工作台</a>
      <span class="task-crumb-sep">›</span>
      <span>任务列表</span>
    </div>
    <div class="task-title-row">
      <span class="task-title-icon">{{ icon('task') }}</span>
      <div class="task-title-text">
        <h2>任务管理</h2>
        <p>管理工作任务、进度状态和任务流转</p>
      </div>
    </div>
  </div>
  <div class="task-topbar-actions">
    {% if session.get('role')!='user' %}
    <a href="{{ url_for('tasks.create_task') }}" class="btn btn-primary">{{ icon('add') }} 创建任务</a>
    {% endif %}
  </div>
</div>

<!-- Batch Actions Bar (hidden by default) -->
<div id="batchActionsBar" style="display:none;background:#1e293b;color:white;padding:12px 16px;border-radius:10px;margin-bottom:16px;align-items:center;justify-content:space-between;">
  <div style="display:flex;align-items:center;gap:12px;">
    <span id="selectedCount">已选择 0 项</span>
    <label style="display:flex;align-items:center;gap:6px;cursor:pointer;font-size:13px;">
      <input type="checkbox" id="selectAllCheckbox" onchange="toggleSelectAll(this)" style="width:16px;height:16px;"> 全选
    </label>
  </div>
  <div style="display:flex;gap:8px;">
    <button type="button" class="btn" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;" onclick="batchArchive()">{{ icon('archive') }} 批量归档</button>
    {% if session.get('role') in ('super_admin', 'dept_admin') %}
    <button type="button" class="btn" style="background:#dc2626;border:1px solid #dc2626;color:white;" onclick="batchDelete()">{{ icon('trash') }} 批量删除</button>
    {% endif %}
    <button type="button" class="btn" style="background:rgba(255,255,255,0.1);border:1px solid rgba(255,255,255,0.2);color:white;" onclick="clearSelection()">✕ 取消</button>
  </div>
</div>

<!-- Quick Filters (priority, category, department) -->
<div class="toolbar">
  <form method="get" id="taskFilterForm" action="{{ url_for('tasks.list_tasks') }}">
    <div class="toolbar-filters">
      <select name="priority" class="form-select">
        <option value="">全部优先级</option>
        <option value="high" {% if priority=='high' %}selected{% endif %}>高优先级</option>
        <option value="medium" {% if priority=='medium' %}selected{% endif %}>中优先级</option>
        <option value="low" {% if priority=='low' %}selected{% endif %}>低优先级</option>
      </select>
      <select name="category_id" class="form-select">
        <option value="">全部类别</option>
        {% for c in categories %}<option value="{{ c.id }}" {% if category_filter==c.id %}selected{% endif %}>{{ c.name }}</option>{% endfor %}
      </select>
      <select name="department" class="form-select">
        <option value="">全部部门</option>
        {% for d in departments %}
        <option value="{{ d }}" {% if department==d %}selected{% endif %}>{{ d }}</option>
        {% endfor %}
      </select>
      <input type="text" name="keyword" placeholder="输入关键词" value="{{ keyword }}" class="form-input" style="width:160px;">
      <select name="search_scope" class="form-select" style="width:130px;">
        <option value="title" {% if search_scope=='title' %}selected{% endif %}>仅标题</option>
        <option value="all" {% if search_scope!='title' %}selected{% endif %}>标题+内容</option>
      </select>
      <input type="hidden" name="status" value="{{ status }}">
      <button type="submit" class="btn btn-primary">{{ icon('filter') }} 筛选</button>
      <a href="{{ url_for('tasks.list_tasks') }}" class="btn">重置</a>
    </div>
  </form>
</div>

<div id="task-list-container">
  {% include 'tasks/_list_content.html' %}
</div>

<script>
/* AJAX filter — load partial content without page reload */
function filterTasks(link) {
    var url = link.href + (link.href.indexOf('?') > -1 ? '&' : '?') + 'partial=1';
    var container = document.getElementById('task-list-container');
    if (!container) return true;
    container.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;">加载中...</div>';
    var xhr = new XMLHttpRequest();
    xhr.open('GET', url, true);
    xhr.onload = function() {
        if (xhr.status === 200) {
            container.innerHTML = xhr.responseText;
            if (window.history && window.history.pushState) {
                window.history.pushState(null, '', link.href);
            }
            var statusInput = document.querySelector('#taskFilterForm input[name="status"]');
            if (statusInput) {
                var statusValue = new URL(link.href, window.location.origin).searchParams.get('status') || '';
                statusInput.value = statusValue;
            }
            // re-bind batch checkbox events
            var sa = document.getElementById('selectAllTop');
            if (sa) sa.onchange = function(){ toggleSelectAll(this); };
        } else {
            container.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">加载失败</div>';
        }
    };
    xhr.onerror = function() {
        container.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">网络错误</div>';
    };
    xhr.send();
    return false;
}

/* Wire quick filter form to submit via AJAX too */
(function() {
    var form = document.getElementById('taskFilterForm');
    if (form) {
        form.addEventListener('submit', function(e) {
            e.preventDefault();
            var params = new URLSearchParams(new FormData(this));
            var cleanParams = new URLSearchParams();
            params.forEach(function(value, key) {
                if (value !== '') cleanParams.append(key, value);
            });
            var pageUrl = this.getAttribute('action') + (cleanParams.toString() ? '?' + cleanParams.toString() : '');
            var url = pageUrl + (pageUrl.indexOf('?') > -1 ? '&' : '?') + 'partial=1';
            var container = document.getElementById('task-list-container');
            if (!container) return;
            container.innerHTML = '<div style="text-align:center;padding:40px;color:#64748b;">加载中...</div>';
            var xhr = new XMLHttpRequest();
            xhr.open('GET', url, true);
            xhr.onload = function() {
                if (xhr.status === 200) {
                    container.innerHTML = xhr.responseText;
                    if (window.history && window.history.pushState) {
                        window.history.pushState(null, '', pageUrl);
                    }
                    var sa = document.getElementById('selectAllTop');
                    if (sa) sa.onchange = function(){ toggleSelectAll(this); };
                }
                else { container.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">加载失败</div>'; }
            };
            xhr.onerror = function() { container.innerHTML = '<div style="text-align:center;padding:40px;color:#dc2626;">网络错误</div>'; };
            xhr.send();
        });
    }
})();

function getSelectedIds() {
    var checkboxes = document.querySelectorAll('.task-checkbox:checked');
    var ids = [];
    for (var i = 0; i < checkboxes.length; i++) {
        ids.push(parseInt(checkboxes[i].value));
    }
    return ids;
}

function updateSelectionCount() {
    var selected = getSelectedIds();
    var count = selected.length;
    var bar = document.getElementById('batchActionsBar');
    var countText = document.getElementById('selectedCount');

    if (count > 0) {
        bar.style.display = 'flex';
        countText.textContent = '已选择 ' + count + ' 项';
    } else {
        bar.style.display = 'none';
    }

    // Update select all checkbox
    var allCheckboxes = document.querySelectorAll('.task-checkbox');
    var selectAllTop = document.getElementById('selectAllTop');
    if (selectAllTop) {
        selectAllTop.checked = (count === allCheckboxes.length && count > 0);
        selectAllTop.indeterminate = (count > 0 && count < allCheckboxes.length);
    }
}

function toggleSelectAll(checkbox) {
    var checkboxes = document.querySelectorAll('.task-checkbox');
    for (var i = 0; i < checkboxes.length; i++) {
        checkboxes[i].checked = checkbox.checked;
    }
    updateSelectionCount();
}

function clearSelection() {
    var checkboxes = document.querySelectorAll('.task-checkbox');
    for (var i = 0; i < checkboxes.length; i++) {
        checkboxes[i].checked = false;
    }
    var selectAllTop = document.getElementById('selectAllTop');
    if (selectAllTop) {
        selectAllTop.checked = false;
        selectAllTop.indeterminate = false;
    }
    document.getElementById('batchActionsBar').style.display = 'none';
}

function batchArchive() {
    var ids = getSelectedIds();
    if (ids.length === 0) { alert('请先选择任务'); return; }
    if (!confirm('确定要归档选中的 ' + ids.length + ' 个任务吗？')) return;

    var formData = new FormData();
    formData.append('ids', JSON.stringify(ids));

    postForm('{{ url_for("tasks.batch_archive") }}', formData);
}

function batchDelete() {
    var ids = getSelectedIds();
    if (ids.length === 0) { alert('请先选择任务'); return; }
    if (!confirm('确定要删除选中的 ' + ids.length + ' 个任务吗？此操作不可恢复！')) return;

    var formData = new FormData();
    formData.append('ids', JSON.stringify(ids));

    postForm('{{ url_for("tasks.batch_delete") }}', formData);
}

function postForm(url, formData) {
    var xhr = new XMLHttpRequest();
    xhr.open('POST', url, true);
    xhr.setRequestHeader('X-Requested-With', 'XMLHttpRequest');
    xhr.onload = function() {
        if (xhr.status === 200) {
            try {
                var data = JSON.parse(xhr.responseText);
                if (data.success) {
                    location.reload();
                } else {
                    alert(data.message || '操作失败');
                }
            } catch (e) {
                location.reload();
            }
        } else {
            alert('操作失败');
        }
    };
    xhr.onerror = function() { alert('操作失败'); };
    xhr.send(formData);
}
</script>

</body>
</html>
